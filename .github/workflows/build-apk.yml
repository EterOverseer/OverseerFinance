name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant to produce"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - all

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Test OverseerFinance APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK & Connector Library
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'all'
        run: gradle :app:assembleDebug :rd-connector:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: OverseerFinance-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release APK
        id: build_release
        if: github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'all')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets. Configure RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/release-upload-key.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          KEYSTORE_PATH="$KEYSTORE_FILE" gradle :app:assembleRelease --no-daemon
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        if: steps.build_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OverseerFinance-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAGE_DIR="${RUNNER_TEMP}/release-apks"
          mkdir -p "$STAGE_DIR"

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "${STAGE_DIR}/OverseerFinance-debug.apk"
          fi

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "${STAGE_DIR}/OverseerFinance-release.apk"
          fi

          if [ -z "$(ls -A "$STAGE_DIR")" ]; then
            echo "::error::No APK files found to publish to GitHub Releases."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_TITLE="OverseerFinance ${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="latest"
            RELEASE_TITLE="OverseerFinance Latest Build (#${GITHUB_RUN_NUMBER})"
          fi

          RELEASE_NOTES="Automated APK build from commit ${GITHUB_SHA} (Run #${GITHUB_RUN_NUMBER})."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "${STAGE_DIR}"/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" "${STAGE_DIR}"/*.apk \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
